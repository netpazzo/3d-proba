<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioklimatska pergola – 360° prikaz</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #f4f2ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #pano { position: fixed; inset: 0; }
  .traka { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; gap: 16px;
    align-items: center; justify-content: space-between; padding: 12px 16px 12px 56px;
    background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0)); pointer-events: none; }
  .traka h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .traka a { pointer-events: auto; color: inherit; font-size: 14px; text-decoration: none;
    padding: 8px 12px; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; }
  .traka a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .uputa { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 2;
    font-size: 13px; padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,.5);
    pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="traka">
  <h1>Bioklimatska pergola</h1>
  <a href="index.html">← Natrag na proizvod</a>
</div>
<div id="pano" role="img" aria-label="360° prikaz: Bioklimatska pergola u prostoru. Povucite za razgledavanje."></div>
<p class="uputa">Povucite za razgledavanje · kotačić ili dva prsta za zumiranje</p>
<script>
  var mirno = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  pannellum.viewer("pano", {
    type: "equirectangular",
    panorama: "panorama.jpg",
    autoLoad: true,
    yaw: 0,
    pitch: -8,
    hfov: 100,
    minHfov: 40,
    maxHfov: 120,
    autoRotate: mirno ? 0 : -2,
    autoRotateInactivityDelay: 4000,
    showControls: true,
    strings: {
      loadButtonLabel: "Pritisnite za<br>360° prikaz",
      loadingLabel: "Učitavanje…",
      bylineLabel: "",
      noPanoramaError: "Panorama nije zadana.",
      fileAccessError: "Datoteka %s se ne može otvoriti. Stranicu otvorite preko poslužitelja, ne dvoklikom.",
      malformedURLError: "Adresa panorame nije ispravna.",
      iOS8WebGLError: "Ovaj preglednik ne prikazuje panoramu.",
      genericWebGLError: "Preglednik ne podržava WebGL, pa se panorama ne može prikazati.",
      textureSizeError: "Panorama je prevelika za ovaj uređaj (%s px; najviše %s px).",
      unknownError: "Nepoznata greška. Provjerite konzolu preglednika."
    }
  });
</script>
</body>
</html>
